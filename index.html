<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampklar | Youth Handball Platform Preview</title>
  <meta name="description" content="Live preview of a secure youth handball platform: parent registration, email verification, child profiles, consent forms, GDPR tools and an admin dashboard.">
  <meta name="theme-color" content="#F4F7FC">
  <meta property="og:image" content="assets/img/shot.webp">
  <meta property="og:title" content="Kampklar | Youth Handball Platform Preview">
  <meta property="og:description" content="Click through the real flows: sign-up, email codes, child profiles, consent PDFs, GDPR tools and the admin dashboard.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="assets/video/reel.jpg">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Kampklar home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 13c6 3 18 3 24 0M5 21c6-3 16-3 22 0" fill="none" stroke="#FF6A2A" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Kampklar</span>
      <em class="brand-tag">Preview</em>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/" data-nav="">Overview</a>
      <a href="#/register" data-nav="register">Sign up</a>
      <a href="#/portal" data-nav="portal">Parent portal</a>
      <a href="#/admin" data-nav="admin">Admin</a>
    </nav>
    <div class="top-actions">
      <button class="inbox-btn" id="inboxBtn" aria-label="Open demo inbox" aria-controls="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg>
        <span class="inbox-label">Demo inbox</span>
        <span class="badge" id="inboxBadge" hidden>0</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <aside class="inbox" id="inbox" aria-label="Demo inbox" aria-hidden="true">
    <div class="inbox-head">
      <div>
        <h2>Demo inbox</h2>
        <p>Every email the platform sends lands here.</p>
      </div>
      <button class="icon-btn" data-inbox-close aria-label="Close inbox"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="inbox-body">
      <ul class="mail-list" id="mailList"></ul>
      <article class="mail-view" id="mailView" hidden></article>
    </div>
  </aside>
  <div class="inbox-scrim" data-inbox-close></div>

  <div class="wipe" aria-hidden="true"><span></span><span></span></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="cursor" aria-hidden="true"><span></span></div>
  <div class="grain" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
